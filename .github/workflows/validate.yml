name: Validate

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

env:
  SITE_ORIGIN: https://iheadwater.github.io
  SITE_BASE: /dailyinfo-web

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Content validation
        run: npm run validate

      - name: Contract regression tests
        run: npm run test

      - name: Astro / TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build
